<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INKITIN Admin</title><link rel="stylesheet" href="admin.css"></head><body><main><h1>INKITIN PRINTING HUB — Admin</h1><p id="state">Loading orders…</p><table id="orders"><thead><tr><th>Order</th><th>Customer</th><th>Status</th><th>Total</th><th>Created</th></tr></thead><tbody></tbody></table><p><a href="../">← Back to Store</a></p></main><script>fetch("/api/admin/orders").then(r=>r.json()).then(d=>{document.getElementById("state").textContent=(d.orders||[]).length+" orders";document.querySelector("tbody").innerHTML=(d.orders||[]).map(o=>"<tr><td>"+o.order_number+"</td><td>"+o.full_name+"<br><small>"+o.email+"</small></td><td>"+o.status+"</td><td>₹"+Number(o.total).toFixed(2)+"</td><td>"+new Date(o.created_at).toLocaleString()+"</td></tr>").join("")}).catch(()=>document.getElementById("state").textContent="Unable to load orders.")</script></body></html>
